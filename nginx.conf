server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA fallback so go_router deep links survive a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the entrypoints; Flutter doesn't hash these filenames.
    location ~ ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
