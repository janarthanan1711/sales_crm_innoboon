name: sales_hub
description: "Sales Prospecting & CRM Platform — SalesHub"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Functional programming
  dartz: ^0.10.1

  # Networking
  dio: ^5.8.0+1

  # Routing
  go_router: ^15.1.3

  # Dependency injection
  get_it: ^8.0.3

  # Local storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1

  # Utilities
  uuid: ^4.5.1
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
