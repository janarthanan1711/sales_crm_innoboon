# Netlify build config for the SalesHub Flutter web app.
# Flutter isn't preinstalled on Netlify's build image, so we clone it,
# put it on PATH, then build the web release into build/web.
[build]
  command = "[ -d flutter ] || git clone https://github.com/flutter/flutter.git -b stable --depth 1 && export PATH=\"$PATH:$PWD/flutter/bin\" && flutter config --enable-web && flutter pub get && flutter build web --release"
  publish = "build/web"
